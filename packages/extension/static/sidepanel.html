<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AnyMCP</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body class="panel">
    <header>
      <img src="icons/icon32.png" alt="" />
      <h1>AnyMCP</h1>
      <span class="status"><span class="dot" id="dot"></span><span id="status-text">…</span></span>
    </header>
    <main>
      <p id="status-note" class="note" hidden></p>
      <section id="savings" hidden></section>
      <section id="site" class="card"></section>
      <section id="sites" hidden></section>
      <p class="hint">
        Ask your AI to manage tools: “remove the learned Instagram tools”, “how many tokens has AnyMCP saved?”, “share my
        instagram.com profile”.
      </p>
      <section id="settings"></section>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
