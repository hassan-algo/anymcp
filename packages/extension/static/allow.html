<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AnyMCP: allow a site</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body class="approve">
    <div class="brand"><img src="icons/icon32.png" alt="" />AnyMCP</div>
    <h1 id="title">Allow a site?</h1>
    <p id="message" class="muted">Loading…</p>
    <div class="actions" id="choices">
      <button id="allow" class="primary" hidden>Allow on this site</button>
      <button id="notnow" hidden>Not now</button>
    </div>
    <p class="foot">AnyMCP then remembers this site, so next time your AI can use it directly.</p>
    <script src="allow.js"></script>
  </body>
</html>
